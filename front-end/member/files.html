<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원 관리 시스템 - 파일</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card wide">
    <nav class="nav">
      <a href="member_append.html">회원 등록</a>
      <a href="member_list.html">회원 목록</a>
      <a href="files.html" class="active">파일</a>
    </nav>

    <h2>파일 업로드 / 다운로드</h2>

    <form id="uploadForm" class="upload-form">
      <div class="form-group">
        <label>업로드할 파일 *</label>
        <input type="file" id="file" required>
        <p class="hint">같은 이름의 파일이 이미 있으면 업로드되지 않습니다. 최대 10MB.</p>
      </div>
      <button type="submit" id="uploadButton">업로드</button>
    </form>

    <div class="toolbar">
      <strong>업로드된 파일</strong>
      <button type="button" id="reload">새로고침</button>
    </div>

    <div id="status" class="status"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>파일 이름</th>
            <th>크기</th>
            <th>수정일시</th>
            <th>다운로드</th>
          </tr>
        </thead>
        <tbody id="fileRows"></tbody>
      </table>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    // 서버의 MAX_UPLOAD_MB 설정(기본 10)과 같게 둔다. 서버도 한 번 더 검사한다.
    const MAX_UPLOAD_MB = 10;
    const LIST_LIMIT = 100;

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1024 / 1024).toFixed(1) + " MB";
    }

    // 서버에서 받은 값은 textContent 로만 넣어서 화면에서 코드로 실행되지 않게 한다
    function addCell(row, text) {
      const td = document.createElement("td");
      td.textContent = text;
      row.appendChild(td);
      return td;
    }

    function render(files) {
      const tbody = document.getElementById("fileRows");
      tbody.replaceChildren();
      files.forEach(function (f) {
        const tr = document.createElement("tr");
        addCell(tr, f.key);
        addCell(tr, formatSize(f.size));
        addCell(tr, new Date(f.last_modified).toLocaleString("ko-KR"));

        const link = document.createElement("a");
        link.href = `${API_BASE_URL}/files/${encodeURIComponent(f.key)}`;
        link.textContent = "다운로드";
        addCell(tr, "").appendChild(link);

        tbody.appendChild(tr);
      });
    }

    // 파일 목록 조회 (${API_BASE_URL}/files)
    async function loadFiles() {
      setStatus("불러오는 중...");

      try {
        const response = await fetch(`${API_BASE_URL}/files?limit=${LIST_LIMIT}`);
        const result = await response.json();

        if (!response.ok) {
          setStatus("조회 실패: " + errorDetail(result));
          return;
        }

        render(result.data);
        if (result.data.length === 0) {
          setStatus("업로드된 파일이 없습니다.");
        } else if (result.is_truncated) {
          setStatus(`최대 ${LIST_LIMIT}개까지만 표시합니다.`);
        } else {
          setStatus("");
        }
      } catch (error) {
        console.error("파일 목록 조회 실패:", error);
        setStatus("서버 통신 중 오류가 발생했습니다.");
      }
    }

    // 파일 업로드 (${API_BASE_URL}/files)
    document.getElementById("uploadForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const file = document.getElementById("file").files[0];
      if (!file) return;

      if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {
        alert(`파일이 너무 큽니다. (최대 ${MAX_UPLOAD_MB}MB)`);
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      const button = document.getElementById("uploadButton");
      button.disabled = true; // 두 번 눌러서 같은 파일이 두 번 올라가지 않게

      try {
        const response = await fetch(`${API_BASE_URL}/files`, {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (response.ok) {
          alert("파일이 업로드되었습니다!");
          document.getElementById("uploadForm").reset();
          loadFiles();
        } else {
          alert("업로드 실패: " + errorDetail(result));
        }
      } catch (error) {
        console.error("업로드 요청 실패:", error);
        alert("서버 통신 중 오류가 발생했습니다.");
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("reload").addEventListener("click", loadFiles);

    loadFiles();
  </script>
</body>

</html>
